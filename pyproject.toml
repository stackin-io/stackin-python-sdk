[project]
name = "stackin"
version = "0.1.0"
authors = [
  { name = "Fernando Celmer", email = "email@fernandocelmer.com" },
]
description = "Python SDK for issuing, consulting and cancelling electronic invoices."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = [
  "nfe",
  "nfse",
  "nota-fiscal",
  "nota-fiscal-eletronica",
  "invoice",
  "fiscal-document",
  "brazil",
  "sefaz",
  "e-invoicing",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Natural Language :: Portuguese (Brazilian)",
]
dependencies = [
  "requests",
  "pydantic",
]

[tool.poetry]
name = "stackin"
version = "0.1.0"
description = "Python SDK for issuing, consulting and cancelling electronic invoices."
authors = ["Fernando Celmer <email@fernandocelmer.com>"]
readme = "README.md"
license = "MIT"
package-mode = true
packages = [{ include = "stackin" }]

[tool.poetry.dependencies]
python = ">=3.10.0"
requests = "^2.32.4"
pydantic = "^2.11.7"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
python-dotenv = "^1.0.1"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
