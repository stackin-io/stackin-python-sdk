name: 📦 Package PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: The release to publish, without the v prefix
        required: true
        type: string
      registry:
        description: pypi or testpypi
        required: true
        type: choice
        options: [pypi, testpypi]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/test.yml
    secrets: inherit

  code-quality:
    name: Code Quality Checks
    uses: ./.github/workflows/code-quality.yml
    secrets: inherit

  integration:
    name: Issue a real document
    needs: [test, code-quality]
    uses: ./.github/workflows/integration.yml
    secrets: inherit

  deploy:
    name: Deploy to ${{ inputs.registry == 'testpypi' && 'TestPyPI' || 'PyPI' }}
    needs: [test, code-quality, integration]
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ inputs.version }}

      - name: 🔍 Verify version
        uses: ./.github/actions/verify-version
        with:
          expected: v${{ inputs.version }}

      - name: 📦 Build Package
        uses: ./.github/actions/build-package
        with:
          python-version: "3.10"

      - name: 📦 Publish Package to TestPyPI
        if: inputs.registry == 'testpypi'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
          verbose: true

      - name: 📦 Publish Package to PyPI
        if: inputs.registry == 'pypi'
        uses: pypa/gh-action-pypi-publish@release/v1
